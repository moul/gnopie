# staticcheck's defaults, with three style checks turned back ON and two off.
#
# ON, because each one is about a claim this code makes in prose:
#   ST1000  a package needs a doc comment.
#   ST1020  an exported function's comment starts with its name. This matters
#           more than usual here: several functions carry long comments
#           explaining WHY a number is measured rather than guessed, and a
#           comment that has drifted off its function is how that reasoning gets
#           attached to the wrong thing.
#   ST1021  the same, for exported types.
#
# OFF, deliberately:
#   ST1005  wants an error string to be one lowercase phrase with no trailing
#           punctuation. gnopie writes the opposite on purpose: an error names
#           the fix, which usually takes a second sentence ("fee %q must be in
#           ugnot (for example 23466ugnot)"). Keeping ST1005 would mean losing
#           that or annotating every such error.
#   ST1003  naming conventions. The wire-format structs mirror gno's own field
#           spellings (PkgPath, FuncName, GasWanted) and renaming them to match
#           Go house style would make them stop matching the thing they model.
#
# The rest are staticcheck's own defaults, listed rather than inherited so that
# reading this file tells you the whole configuration.
checks = ["all", "-ST1003", "-ST1005", "-ST1016", "-ST1022", "-ST1023"]
