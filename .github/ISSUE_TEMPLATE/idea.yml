name: Verb, flag or idea
description: Something gnopie should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what do you do today instead
      description: >
        The workaround matters more than the feature. It says what the real shape
        is, and it is often already half a design. "I drop back to writing a
        gnokey maketx by hand because..." is the most useful answer here.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What you would type, and what it would print
      render: shell
  - type: textarea
    id: rejected
    attributes:
      label: What you considered and rejected
      description: Optional. The interesting part of a change is usually the option that did not win.
