name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release run per tag, ever, and the one in flight wins.
#
# v0.1.0 produced TWO runs from a single tag push (36457009047 and
# 36457009230, same second, same SHA). One uploaded all seven assets and
# succeeded; the other reached the upload step afterwards and died on
# "422 Validation Failed ... already_exists", reporting a red release for a tag
# that had in fact published correctly. A red X on a good release is worse than
# useless: it trains you to ignore the next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: goreleaser reads the tag it is building, and
      # `go build` stamps the version from VCS state, so a shallow clone
      # produces a binary that reports the wrong version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Prove the tag is green before publishing anything from it. CI already
      # ran on the commit, but a tag can be pushed at any commit, including one
      # that never saw a pull request.
      - id: pin
        run: echo "ref=$(go list -m -f '{{.Version}}' github.com/gnolang/gno)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          ref: ${{ steps.pin.outputs.ref }}
          path: gnoroot
      - run: GNOROOT="$GITHUB_WORKSPACE/gnoroot" go test -count=1 ./...
        timeout-minutes: 20

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
